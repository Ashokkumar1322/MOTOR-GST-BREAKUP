<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Insurance Claim Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 13px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #000;
            padding: 4px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            font-size: 12px;
        }
        /* Column Width Controls */
        .col-sno { width: 40px; }
        .col-cat { width: 180px; }
        .col-amt { width: 90px; }
        .col-narrow { width: 60px; } /* For DEP %, GST %, etc. */
        .col-action { width: 50px; }
        
        select, input {
            width: 100%;
            padding: 4px;
            box-sizing: border-box;
            font-size: 12px;
            text-align: right;
        }
        select { text-align: left; }
        .spacer {
            width: 15px;
            border-top: none;
            border-bottom: none;
            background-color: #fff;
        }
        .readonly-cell {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        .total-row td {
            font-weight: bold;
            background-color: #f9f9f9;
        }
        .grand-total-row td {
            font-weight: bold;
            background-color: #e2e3e5;
        }
        .btn {
            cursor: pointer;
            padding: 2px 6px;
            font-weight: bold;
        }
        .btn-add { background-color: #4CAF50; color: white; border: 1px solid #3e8e41; }
        .btn-remove { background-color: #f44336; color: white; border: 1px solid #da190b; }
    </style>
</head>
<body>

    <h2>Motor Insurance Claim Calculator</h2>

    <table id="claimTable">
        <thead>
            <tr>
                <th class="col-sno">S.No</th>
                <th class="col-cat">Category</th>
                <th class="col-amt">Assessed Amt<br>Before Dep</th>
                <th class="col-narrow">DEP %</th>
                <th class="col-narrow">GST %</th>
                <th class="col-narrow">IMT 23<br>N/Y</th>
                <th class="spacer"></th>
                <th class="col-amt">Assessed Amt<br>Before Dep</th>
                <th class="col-narrow">DEP AMT</th>
                <th class="col-narrow">IMT 23<br>DEP AMT</th>
                <th class="col-amt">NET AMT</th>
                <th class="col-narrow">GST AMT</th>
                <th class="col-amt">TOTAL</th>
                <th class="col-action">Action</th>
            </tr>
        </thead>
        
        <!-- LABOUR SECTION -->
        <tbody id="labourBody">
            <tr class="labour-row">
                <td class="sno">1</td>
                <td>
                    <select>
                        <option value="labour">LABOUR</option>
                        <option value="painting">PAINTING (Labour + Material)</option>
                    </select>
                </td>
                <td><input type="number" placeholder="0.00"></td>
                <td><input type="number" placeholder="0"></td>
                <td><input type="number" value="18"></td>
                <td>
                    <select>
                        <option value="N" selected>N</option>
                        <option value="Y">Y</option>
                    </select>
                </td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><button type="button" class="btn btn-remove" onclick="removeRow(this, 'labour')">-</button></td>
            </tr>
        </tbody>
        <tbody>
            <tr class="total-row">
                <td></td>
                <td style="text-align: left;">LABOUR TOTAL</td>
                <td></td><td></td><td></td><td></td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><button type="button" class="btn btn-add" onclick="addRow('labour')">+</button></td>
            </tr>
        </tbody>

        <!-- PARTS SECTION -->
        <tbody id="partsBody">
            <tr class="parts-row">
                <td class="sno">1</td>
                <td><input type="text" placeholder="Enter Part Name" style="text-align: left;"></td>
                <td><input type="number" placeholder="0.00"></td>
                <td><input type="number" placeholder="0"></td>
                <td><input type="number" value="18"></td>
                <td>
                    <select>
                        <option value="N" selected>N</option>
                        <option value="Y">Y</option>
                    </select>
                </td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><button type="button" class="btn btn-remove" onclick="removeRow(this, 'parts')">-</button></td>
            </tr>
        </tbody>
        <tbody>
            <tr class="total-row">
                <td></td>
                <td style="text-align: left;">PARTS TOTAL</td>
                <td></td><td></td><td></td><td></td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><button type="button" class="btn btn-add" onclick="addRow('parts')">+</button></td>
            </tr>
            
            <!-- GRAND TOTAL -->
            <tr class="grand-total-row">
                <td></td>
                <td style="text-align: left;">GRAND TOTAL</td>
                <td></td><td></td><td></td><td></td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <script>
        function addRow(type) {
            const tbodyId = type === 'labour' ? 'labourBody' : 'partsBody';
            const rowClass = type === 'labour' ? 'labour-row' : 'parts-row';
            const tbody = document.getElementById(tbodyId);
            
            // Create a new row
            const newRow = document.createElement('tr');
            newRow.className = rowClass;
            
            // Define Category cell based on type
            const categoryCell = type === 'labour' 
                ? `<td>
                    <select>
                        <option value="labour">LABOUR</option>
                        <option value="painting">PAINTING (Labour + Material)</option>
                    </select>
                   </td>`
                : `<td><input type="text" placeholder="Enter Part Name" style="text-align: left;"></td>`;

            // Inner HTML of the new row (includes default GST 18)
            newRow.innerHTML = `
                <td class="sno"></td>
                ${categoryCell}
                <td><input type="number" placeholder="0.00"></td>
                <td><input type="number" placeholder="0"></td>
                <td><input type="number" value="18"></td>
                <td>
                    <select>
                        <option value="N" selected>N</option>
                        <option value="Y">Y</option>
                    </select>
                </td>
                <td class="spacer"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><input type="number" class="readonly-cell" readonly placeholder="0.00"></td>
                <td><button type="button" class="btn btn-remove" onclick="removeRow(this, '${type}')">-</button></td>
            `;
            
            tbody.appendChild(newRow);
            updateSerialNumbers(type);
        }

        function removeRow(button, type) {
            const tbodyId = type === 'labour' ? 'labourBody' : 'partsBody';
            const tbody = document.getElementById(tbodyId);
            
            // Ensure at least one row remains
            if (tbody.getElementsByTagName('tr').length > 1) {
                const row = button.closest('tr');
                row.remove();
                updateSerialNumbers(type);
            } else {
                alert('You must have at least one row in this section.');
            }
        }

        function updateSerialNumbers(type) {
            const tbodyId = type === 'labour' ? 'labourBody' : 'partsBody';
            const rows = document.getElementById(tbodyId).getElementsByTagName('tr');
            
            for (let i = 0; i < rows.length; i++) {
                rows[i].querySelector('.sno').textContent = i + 1;
            }
        }
    </script>
</body>
</html>
